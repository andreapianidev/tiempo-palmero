<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>relieve — banco de pruebas</title>
    <style>
      body { background: #080b10; color: #ddd; font: 12px monospace; margin: 12px }
      figure { display: inline-block; margin: 0 8px 8px 0 }
      figcaption { text-align: center }
      canvas, img { image-rendering: pixelated; border: 1px solid #333 }
    </style>
  </head>
  <body>
    <!--
      Banco de pruebas del sombreado. NO forma parte del sitio: solo lo sirve
      Vite en desarrollo, en /dev/relieve.html.

      Pinta cinco teselas sueltas —dos del zoom del modelo, una por debajo y dos
      por encima— con el mismo camino que usa el protocolo `relieve://`. Existe
      porque un shader que no compila o una ventana mal calculada no dan error
      en ninguna parte: el mapa se queda como estaba. Aquí se ven.

      Ya ha pagado su sitio dos veces: cazó el damero de un píxel de paso que
      salía a z13 (una lectura a saltos restándose a una superficie continua) y
      la rampa del mar centrada en cero, que dejaba el océano a media opacidad.
    -->
    <div id="log">cargando…</div>
    <div id="out"></div>
    <script type="module">
      import { demMosaic } from '/src/lib/relief/mosaic.ts'
      import { reliefWindow } from '/src/lib/relief/window.ts'
      import { surface, upload } from '/src/lib/relief/gl.ts'
      import { RELIEF_FRAG } from '/src/lib/relief/shader.ts'
      import { RELIEF_PARAMS, RELIEF_TILE_PX } from '/src/lib/relief/params.ts'
      import { metersPerPixel } from '/src/lib/relief/coverage.ts'

      const log = (m) => (document.getElementById('log').textContent += '\n' + m)

      const manifest = await fetch('/dem/manifest.json').then((r) => r.json())
      const gl2 = surface()
      if (!gl2) log('SIN WEBGL2')
      const program = gl2.program(RELIEF_FRAG)
      log('programa: ' + (program ? 'ok' : 'FALLO DE COMPILACIÓN'))
      const { gl } = gl2
      const tex = gl2.texture()
      const p = RELIEF_PARAMS

      async function tile(z, x, y) {
        const win = reliefWindow(manifest, z, x, y)
        if (!win) return null
        const board = await demMosaic(manifest, win.demZoom, win.demX, win.demY)
        if (!board) return null
        const mosaic = manifest.tileSize * 3
        return gl2.draw(program, RELIEF_TILE_PX, RELIEF_TILE_PX, () => {
          gl.activeTexture(gl.TEXTURE0)
          upload(gl, tex, board)
          const u = (n) => gl.getUniformLocation(program, n)
          gl.uniform1i(u('u_dem'), 0)
          gl.uniform2f(u('u_demSize'), mosaic, mosaic)
          gl.uniform3f(u('u_window'), win.originX, win.originY, win.side)
          gl.uniform1f(u('u_out'), RELIEF_TILE_PX)
          gl.uniform1f(u('u_mpp'), metersPerPixel(win.demZoom, win.demY, manifest.tileSize))
          gl.uniform4fv(u('u_azimuth'), p.azimuths)
          gl.uniform4fv(u('u_weight'), p.weights)
          gl.uniform1f(u('u_altitude'), p.altitude)
          gl.uniform1f(u('u_sky'), p.sky)
          gl.uniform1f(u('u_texture'), p.texture)
          gl.uniform1f(u('u_textureScale'), p.textureScale)
          gl.uniform1f(u('u_accentAt'), p.accentAt)
          gl.uniform1f(u('u_accent'), p.accent)
          gl.uniform3fv(u('c_shadow'), p.shadow)
          gl.uniform3fv(u('c_highlight'), p.highlight)
          gl.uniform3fv(u('c_accent'), p.accentColor)
          gl.uniform3fv(u('c_warm'), p.warm)
          gl.uniform3fv(u('c_cool'), p.cool)
          gl.uniform1f(u('u_tint'), p.tint)
          gl.uniform1f(u('u_summit'), p.summit)
        })
      }

      const out = document.getElementById('out')
      // La Caldera de Taburiente, la cumbre y el valle de Aridane, más un
      // trozo a doble zoom para ver qué pasa por encima del modelo.
      const wanted = [
        [11, 922, 853, 'z11 isla norte'],
        [12, 1844, 1706, 'z12 Caldera'],
        [12, 1845, 1707, 'z12 Aridane'],
        [13, 3689, 3413, 'z13 (×2 del modelo)'],
        [14, 7379, 6827, 'z14 (×4 del modelo)'],
      ]
      for (const [z, x, y, label] of wanted) {
        const bmp = await tile(z, x, y)
        const fig = document.createElement('figure')
        const c = document.createElement('canvas')
        c.width = c.height = 256
        if (bmp) c.getContext('2d').drawImage(bmp, 0, 0, 256, 256)
        fig.append(c)
        const cap = document.createElement('figcaption')
        cap.textContent = label + (bmp ? '' : ' — VACÍA')
        fig.append(cap)
        out.append(fig)
      }
      log('listo')
    </script>
  </body>
</html>

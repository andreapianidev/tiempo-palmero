# La misma puerta que exige CLAUDE.md antes de desplegar, pero automática: los
# tests del motor y la compilación de la web.
#
# No hay un trabajo aparte para el escritorio de UE5, que comparte `src/lib`:
# lo que puede romperle el núcleo desde aquí —una importación de `maplibre-gl`
# en tiempo de ejecución, que en QuickJS no existe— lo caza
# `mapStyle.portable.test.ts`, y ese corre dentro de `npm test`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Tests y compilación de la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
